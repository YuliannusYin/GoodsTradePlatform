version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: merchandise-neo4j
    environment:
      - NEO4J_AUTH=neo4j/merchandise123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - merchandise-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: merchandise-server
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=merchandise123
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - merchandise-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: merchandise-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - merchandise-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  merchandise-network:
    driver: bridge
