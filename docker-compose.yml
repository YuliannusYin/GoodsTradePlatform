services:
  postgres:
    image: postgres:16-alpine
    container_name: merchandise-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-merchandise}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-merchandise123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - merchandise-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: merchandise-server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-merchandise}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-merchandise123}
      - JWT_SECRET=${JWT_SECRET:-please-change-this-to-a-secure-random-secret-key-in-production}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      # CORS允许的来源列表，部署时需设置为实际域名（如 https://example.com），多个用逗号分隔
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,https://test.yuliannus2569.rest/}
      # 内置用户初始密码，生产环境务必通过环境变量覆盖默认值
      - APP_INIT_ADMIN_PASSWORD=${APP_INIT_ADMIN_PASSWORD:-Admin@2024}
      - APP_INIT_MERCHANT_PASSWORD=${APP_INIT_MERCHANT_PASSWORD:-Merchant@2024}
      - APP_INIT_TEST_USER_PASSWORD=${APP_INIT_TEST_USER_PASSWORD:-Test@2024}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - merchandise-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: merchandise-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - merchandise-network

volumes:
  postgres_data:

networks:
  merchandise-network:
    driver: bridge
